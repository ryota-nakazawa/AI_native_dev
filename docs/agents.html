<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  :root {
    --bg: #1a1b26; --bar: #15161e; --fg: #c8d0f0; --mid: #8e98c0; --dim: #5b6488; --line: #3b4261;
    --orange: #f5a97f; --blue: #8fb4f8; --green: #a3d9a5; --purple: #b9a8f7; --red: #f7768e;
    --row: 30.72px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0c0d13; overflow: hidden; }
  body { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1200px; height: 1500px; transform-origin: 0 0;
    background: var(--bg); color: var(--fg); font-size: 19.6px; line-height: var(--row); white-space: pre;
    border-radius: 14px; overflow: hidden; font-variant-ligatures: none; }
  #stage > * { position: absolute; }
  b { font-weight: 700; }
  .dim { color: var(--dim); } .mid { color: var(--mid); }
  .orange { color: var(--orange); } .blue { color: var(--blue); } .green { color: var(--green); }
  .purple { color: var(--purple); } .red { color: var(--red); }

  #titlebar { left: 0; top: 0; width: 1200px; height: 42px; background: var(--bar); text-align: center;
    line-height: 42px; font-size: 15px; color: var(--dim); }
  #titlebar i { position: absolute; top: 14px; width: 14px; height: 14px; border-radius: 50%; }
  #header { left: 0; width: 1200px; top: 68px; text-align: center; font-weight: 700; letter-spacing: .5px; }
  #mode { padding: 3px 12px; border-radius: 4px; background: rgba(163,217,165,.14); color: var(--green); }
  #mode.replay { background: rgba(245,169,127,.14); color: var(--orange); }
  #mode.off { background: rgba(247,118,142,.14); color: var(--red); }
  #rule { left: 42px; top: 112px; width: 1127px; border-top: 1px solid #262a3d; }
  #legend { left: 0; width: 1200px; top: 129px; text-align: center; color: var(--mid); }
  #legend span { margin: 0 22px; }
  #legend i { display: inline-block; width: 13px; height: 13px; margin-right: 10px; vertical-align: -1px; }

  .box { border: 2px solid var(--line); background: #171822; display: flex; flex-direction: column;
    justify-content: center; align-items: center; transition: border-color .35s, box-shadow .35s, opacity .35s; }
  .box.flash { box-shadow: 0 0 24px var(--glow, rgba(245,169,127,.5)); }
  #main { left: 520px; top: 173px; width: 460px; height: 177px; border-color: var(--c, var(--orange)); }

  /* 左: モデル別の集計 */
  #panel { left: 42px; top: 177px; width: 265px; height: 1002px; border: 2px solid var(--purple);
    background: #171822; padding: 13px 14px; color: var(--mid); overflow: hidden; }
  #panel .kv { display: flex; } #panel .kv b { margin-left: auto; color: var(--fg); }
  #panel .sep { border-top: 2px dotted #4a4f73; margin: 14px 0 15px; }

  /* サブエージェントの枠 3列 x 2段 */
  #slots { left: 0; top: 0; }
  .sub { width: 268px; height: 215px; border-color: var(--line); }
  .sub.empty { border-style: dashed; opacity: .45; }
  .sub.live { border-color: var(--c); }
  .sub.done { border-color: var(--c); opacity: .62; }
  .sub .prog { display: flex; align-items: center; width: 236px; }
  .sub .bar { width: 96px; height: 20px; background: rgba(143,180,248,.18); margin-right: 12px; position: relative; }
  .sub .bar s { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); transition: width .3s; }
  .sub .calls { margin-left: auto; color: var(--mid); }

  #mix { left: 331px; top: 950px; width: 838px; height: 229px; border: 1px solid var(--line); padding: 20px 18px 0; }
  #mix .title, #log .title { position: absolute; left: 22px; top: -16px; background: var(--bg); padding: 0 10px; color: var(--mid); }
  #mix .r { display: flex; align-items: center; height: var(--row); }
  #mix .n { width: 300px; overflow: hidden; }
  #mix .bar { width: 400px; height: 18px; background: rgba(163,217,165,.12); position: relative; }
  #mix .bar s { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); transition: width .3s; }
  #mix .v { margin-left: auto; }

  #log { left: 42px; top: 1218px; width: 1127px; height: 178px; border: 1px solid var(--line); padding: 13px 18px 0; }
  #log .l { height: var(--row); color: var(--mid); opacity: .75; overflow: hidden; }
  #log .l:last-child { opacity: 1; color: var(--fg); }
  #log .l.in { animation: slide .25s ease-out; }
  @keyframes slide { from { opacity: 0; transform: translateY(8px); } }
  #prompt { left: 42px; top: 1408px; }
  #cursor { display: inline-block; width: 12px; height: 23px; background: var(--green); vertical-align: -5px;
    animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #status { left: 42px; top: 1440px; color: var(--mid); }
  svg { left: 0; top: 0; width: 1200px; height: 1500px; pointer-events: none; }
  .wire { stroke: #4a5278; stroke-width: 2; fill: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="titlebar"><i style="left:16px;background:#ff5f57"></i><i style="left:38px;background:#febc2e"></i><i style="left:60px;background:#28c840"></i><span id="tb">~/.claude/projects · agent watch</span></div>
  <div id="header">CLAUDE CODE AGENT WATCH  <span class="dim">·</span>  <span id="mode" class="off">CONNECTING</span>  <span class="dim">·</span>  <span id="clock" class="mid">--:--:--</span></div>
  <div id="rule"></div>
  <div id="legend"><span><i style="background:var(--orange)"></i>sonnet</span><span><i style="background:var(--blue)"></i>haiku</span><span><i style="background:var(--purple)"></i>opus</span><span><i style="background:var(--green)"></i>other</span></div>

  <svg viewBox="0 0 1200 1500">
    <path class="wire" d="M750 350V400M465 400H1035M465 400V440M750 400V440M1035 400V440M465 655V690M750 655V690M1035 655V690"/>
    <g id="packets"></g>
  </svg>

  <div id="panel"></div>
  <div class="box" id="main"></div>
  <div id="slots"></div>
  <div id="mix"><span class="title">tool mix</span><div id="mixRows"></div></div>
  <div id="log"><span class="title">tool calls</span><div id="lines"></div></div>
  <div id="prompt"><b class="green">~ $</b> <b>node</b> server.mjs <span class="blue" id="args"></span> <span id="cursor"></span></div>
  <div id="status"></div>
</div>

<script>window.WATCH_STATIC = true;</script>
<script src="common.js"></script>
<script>

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const cut = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const num = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'k' : String(Math.round(n));
const dur = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return s >= 3600 ? `${Math.floor(s / 3600)}h${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}m` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const hms = ts => ts ? new Date(ts).toLocaleTimeString('ja-JP', { hour12: false }) : '--:--:--';
const short = m => (m || 'unknown').replace(/^claude-/, '');
// モデル名から色を決める
const fam = m => /opus/.test(m) ? 'purple' : /sonnet/.test(m) ? 'orange' : /haiku/.test(m) ? 'blue' : 'green';
const HEX = { purple: '#b9a8f7', orange: '#f5a97f', blue: '#8fb4f8', green: '#a3d9a5' };
const SPIN = ['◐', '◓', '◑', '◒'];

// ---------- サブエージェントの枠 ----------
const COLX = [465, 750, 1035], ROWY = [440, 690];
const slots = [];
for (let i = 0; i < 6; i++) {
  const el = document.createElement('div');
  el.className = 'box sub empty';
  el.style.cssText = `position:absolute;left:${COLX[i % 3] - 134}px;top:${ROWY[Math.floor(i / 3)]}px`;
  $('slots').appendChild(el);
  slots.push({ el, key: null, c: i % 3, r: Math.floor(i / 3) });
}
const pathTo = s => [[750, 350], [750, 400], [COLX[s.c], 400], [COLX[s.c], ROWY[s.r]]];

// 枠の割り当ては一度決めたら動かさない。空きが無ければ、終わって一番古いものと入れ替える
function assign(agents) {
  const byKey = new Map(agents.map(a => [a.key, a]));
  for (const s of slots) if (s.key && !byKey.has(s.key)) s.key = null;
  const shown = new Set(slots.map(s => s.key).filter(Boolean));
  const waiting = agents.filter(a => !shown.has(a.key)).sort((a, b) => (a.status === 'done') - (b.status === 'done') || b.lastTs - a.lastTs);
  for (const a of waiting) {
    let s = slots.find(s => !s.key);
    if (!s && a.status !== 'done') {
      s = slots.filter(s => byKey.get(s.key).status === 'done').sort((x, y) => byKey.get(x.key).lastTs - byKey.get(y.key).lastTs)[0];
    }
    if (!s) continue;
    s.key = a.key;
  }
  return byKey;
}

// ---------- 配線の上を流れる点 ----------
const packets = [];
function spawn(points, color, speed = 420) {
  const segs = []; let len = 0;
  for (let i = 1; i < points.length; i++) { const d = Math.hypot(points[i][0] - points[i-1][0], points[i][1] - points[i-1][1]); segs.push(d); len += d; }
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const cs = [[5, 1], [3.2, .55], [2.2, .3]].map(([r, o]) => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', r); c.setAttribute('fill', color); c.setAttribute('opacity', o); g.appendChild(c); return c;
  });
  cs[0].style.filter = `drop-shadow(0 0 5px ${color})`;
  $('packets').appendChild(g);
  packets.push({ points, segs, len, pos: 0, speed, g, cs });
}
function at(p, d) {
  d = Math.max(0, Math.min(p.len, d));
  for (let i = 0; i < p.segs.length; i++) {
    if (d <= p.segs[i] || i === p.segs.length - 1) {
      const t = p.segs[i] ? Math.min(1, d / p.segs[i]) : 0, a = p.points[i], b = p.points[i + 1];
      return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    }
    d -= p.segs[i];
  }
}
let last = performance.now(), spin = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; spin = Math.floor(now / 250) % 4;
  for (let i = packets.length - 1; i >= 0; i--) {
    const p = packets[i]; p.pos += p.speed * dt;
    p.cs.forEach((c, k) => { const [x, y] = at(p, p.pos - k * 13); c.setAttribute('cx', x); c.setAttribute('cy', y); });
    if (p.pos >= p.len + 26) { p.g.remove(); packets.splice(i, 1); }
  }
  document.querySelectorAll('.spin').forEach(e => e.textContent = SPIN[spin]);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function flash(el, color) { el.style.setProperty('--glow', color); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 300); }

// ---------- 描画 ----------
let epoch = null, lastSeq = 0, first = true, prevStatus = new Map(), snap = null, offset = 0;

function statusLine(a, now, isMain) {
  if (isMain) a = { ...a, firstTs: a.lastTs };       // main は「今の一手」にかかっている時間を出す
  if (a.status === 'tool') return `<span class="spin">◐</span> ${esc(cut(a.lastTool.replace(/^mcp__.*__/, ''), 14))} <span class="dim">${dur(now - a.firstTs)}</span>`;
  if (a.status === 'done') return isMain ? '<span class="mid">· waiting for user</span>' : `✓ done <span class="dim">${dur(a.lastTs - a.firstTs)}</span>`;
  return `<span class="spin">◐</span> thinking <span class="dim">${dur(now - a.firstTs)}</span>`;
}

function render(d) {
  const now = d.mode === 'live' ? Date.now() : d.now;
  const main = d.agents.find(a => a.key === 'main');
  const subs = d.agents.filter(a => a.key !== 'main');
  const byKey = assign(subs);
  const maxCalls = Math.max(1, ...subs.map(a => a.toolCalls));

  $('mode').className = d.mode === 'replay' ? 'replay' : '';
  $('mode').textContent = d.mode === 'replay' ? `REPLAY ×${d.speed}` : 'LIVE';
  $('clock').textContent = hms(now);
  $('tb').textContent = `${cut(d.title || 'session', 50)} · ${d.sessionId.slice(0, 8)}`;
  $('args').textContent = (d.mode === 'replay' ? '--replay ' : '') + '--session ' + d.sessionId.slice(0, 8);

  if (main) {
    const c = fam(main.model);
    $('main').style.setProperty('--c', HEX[c]);
    $('main').innerHTML =
      `<b class="${c}">main session</b>` +
      `<span class="${c}">${esc(short(main.model))}</span>` +
      `<b>ctx ${num(main.ctx)} · out ${num(main.out)} · ${main.toolCalls} calls</b>` +
      `<span class="${c}">${statusLine(main, now, true)}</span>`;
  }

  for (const s of slots) {
    const a = s.key && byKey.get(s.key);
    if (!a) { s.el.className = 'box sub empty'; s.el.innerHTML = '<span class="dim">— no subagent —</span>'; continue; }
    const c = fam(a.model);
    s.el.className = 'box sub ' + (a.status === 'done' ? 'done' : 'live');
    s.el.style.setProperty('--c', HEX[c]);
    s.el.innerHTML =
      `<b>${esc(cut(a.name, 20))}</b>` +
      `<span class="${c}">${esc(cut(short(a.model), 20))}</span>` +
      `<span class="prog"><span class="bar"><s style="width:${a.toolCalls / maxCalls * 100}%"></s></span><span class="calls">${a.toolCalls} calls</span></span>` +
      `<span class="mid">${esc(cut(a.desc || '—', 21))}</span>` +
      `<span>ctx ${num(a.ctx)} · out ${num(a.out)}</span>` +
      `<span class="${c}">${statusLine(a, now, false)}</span>`;
  }

  // 左パネル: モデル別の合計
  const models = Object.entries(d.models).sort((a, b) => b[1].out - a[1].out).slice(0, 4);
  const kv = (k, v) => `<div class="kv">  ${k}<b>${v}</b></div>`;
  const running = subs.filter(a => a.status !== 'done').length;
  $('panel').innerHTML =
    `<div style="text-align:center" class="purple"><b>MODELS</b></div><div style="text-align:center">this session</div><div> </div>` +
    models.map(([m, v]) => `<div class="${fam(m)}"><b>■ ${esc(cut(short(m), 17))}</b></div>` + kv('msgs', v.msgs) + kv('out', num(v.out)) + kv('in+cache', num(v.inp)) + '<div> </div>').join('') +
    `<div class="sep"></div><div class="purple"><b>advisor</b></div>` + kv('calls', d.advisor.calls) + kv('tokens', num(d.advisor.tokens)) +
    `<div> </div><div class="blue"><b>subagents</b></div>` + kv('running', running) + kv('done', subs.length - running) + kv('total', subs.length);

  const maxTool = Math.max(1, ...d.tools.map(t => t[1]));
  $('mixRows').innerHTML = d.tools.map(([n, v]) =>
    `<div class="r"><span class="n">${esc(cut(n.replace(/^mcp__.*__/, ''), 24))}</span><span class="bar"><s style="width:${v / maxTool * 100}%"></s></span><b class="v">${v}</b></div>`).join('');

  const totOut = d.agents.reduce((s, a) => s + a.out, 0), totCalls = d.agents.reduce((s, a) => s + a.toolCalls, 0);
  const hidden = subs.length - slots.filter(s => s.key).length;
  $('status').innerHTML = `subagents <b class="blue">[${running} running / ${subs.length}]</b>  tool calls <b class="green">[${totCalls}]</b>  out <b class="orange">[${num(totOut)}]</b>` +
    (hidden > 0 ? `  <span class="dim">+${hidden} not shown</span>` : '');
}

function logLine(e) {
  const el = document.createElement('div');
  el.className = 'l in';
  el.innerHTML = `<span class="dim">${hms(e.ts)}</span>  <b class="${fam(e.model)}">${esc(cut(e.name, 16).padEnd(16))}</b> ${esc(cut(e.tool.replace(/^mcp__.*__/, ''), 13).padEnd(13))} <span>${esc(cut(e.text, 52))}</span>`;
  $('lines').appendChild(el);
  while ($('lines').children.length > 5) $('lines').firstChild.remove();
}

function onSnapshot(d) {
  if (d.epoch !== epoch) {                 // サーバー側で再生が最初に戻った
    epoch = d.epoch; lastSeq = 0; first = true; prevStatus.clear();
    slots.forEach(s => s.key = null); $('lines').innerHTML = '';
    packets.length = 0; $('packets').innerHTML = '';
    $('main').innerHTML = '<span class="dim">— waiting for session —</span>';
  }
  snap = d;
  render(d);
  const fresh = d.events.filter(e => e.seq > lastSeq);
  if (fresh.length) lastSeq = fresh[fresh.length - 1].seq;
  if (first) fresh.slice(-5).forEach(logLine);       // 接続前の履歴は動かさず、末尾だけ表示
  else for (const e of fresh.slice(-12)) {
    logLine(e);
    const color = HEX[fam(e.model)];
    if (e.key === 'main') flash($('main'), color);
    else { const s = slots.find(s => s.key === e.key); if (s) { spawn(pathTo(s), color); flash(s.el, color); } }
  }
  // 完了した瞬間に、結果が main に戻る点を流す
  for (const a of d.agents) {
    if (!first && a.key !== 'main' && a.status === 'done' && prevStatus.get(a.key) && prevStatus.get(a.key) !== 'done') {
      const s = slots.find(s => s.key === a.key);
      if (s) { spawn(pathTo(s).reverse(), '#e8ecff', 300); setTimeout(() => flash($('main'), '#e8ecff'), 900); }
    }
    prevStatus.set(a.key, a.status);
  }
  first = false;
}

// 接続と下部の操作バー (ライブ / 再生 / 倍速) は共通部品に任せる。再生範囲は manifest の開始時刻以降
Watch.start({ page: 'agents', scope: 'run', onSnapshot: d => onSnapshot(d) });
</script>
</body>
</html>
