<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" role="img" aria-labelledby="title">
<title id="title">非エンジニア向け開発キットの利用と改善</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#50677b"/></marker></defs>
<rect width="800" height="1050" rx="18" fill="#fafbfc"/>
<rect x="100" y="114" width="640" height="238" rx="18" fill="#e9f5ed" stroke="#85b595"/>
<rect x="100" y="476" width="640" height="505" rx="18" fill="#eaf1fa" stroke="#90accd"/>
<g font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" text-anchor="middle">
<text x="420" y="151" font-size="23" fill="#254d39">開発キットの利用者</text>
<text x="420" y="516" font-size="23" fill="#233f5d">開発キットの開発チーム</text>

<rect x="155" y="26" width="530" height="62" rx="13" fill="#fff2dc" stroke="#a5b8c9"/>
<text x="420" y="58" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#173c60">非エンジニア向け開発キット</text>
<rect x="155" y="174" width="530" height="62" rx="13" fill="#ffffff" stroke="#a5b8c9"/>
<text x="420" y="206" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#173c60">非エンジニアのアイデア・要望</text>
<rect x="155" y="264" width="530" height="62" rx="13" fill="#ffffff" stroke="#a5b8c9"/>
<text x="420" y="296" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#173c60">短時間でモック・PoCを作成</text>
<rect x="155" y="381" width="530" height="62" rx="13" fill="#ffffff" stroke="#a5b8c9"/>
<text x="420" y="413" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#173c60">利用中の失敗・改善要望</text>
<rect x="155" y="542" width="530" height="62" rx="13" fill="#ffffff" stroke="#a5b8c9"/>
<text x="420" y="574" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#173c60">開発キットの機能追加・改善</text>
<rect x="155" y="640" width="530" height="62" rx="13" fill="#ffffff" stroke="#a5b8c9"/>
<text x="420" y="672" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#173c60">Golden Datasetによるリグレッションテスト</text>
<rect x="155" y="738" width="530" height="62" rx="13" fill="#ffffff" stroke="#a5b8c9"/>
<text x="420" y="770" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#173c60">Mutation Testingによるテスト検出力の評価</text>
<rect x="155" y="836" width="530" height="62" rx="13" fill="#ffffff" stroke="#a5b8c9"/>
<text x="420" y="868" dominant-baseline="middle" font-size="20" font-weight="bold" fill="#173c60">品質を確認してリリース</text>
<text x="445" y="465" text-anchor="start" font-size="16" fill="#50677b">開発チームの改善に反映</text>
<text x="420" y="1025" font-size="16" fill="#50677b">改善した開発キットを利用者に届ける</text>
</g>
